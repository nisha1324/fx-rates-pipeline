name: Daily FX refresh

on:
  schedule:
    - cron: "30 16 * * 1-5"   # weekdays 16:30 UTC, after the ECB publishes (~16:00 CET)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-fx
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Offline tests
        run: pytest -q

      - name: Extract, validate, load new rates
        run: python -m pipeline.run

      - name: Rebuild SQL report and charts
        run: python -m report.build

      - name: Commit if anything changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898341+github-actions[bot]@users.noreply.github.com"
          git add data/fx_rates.db results/
          if git diff --cached --quiet; then
            echo "No new rates today; nothing to commit."
          else
            latest=$(python -c "import sqlite3; print(sqlite3.connect('data/fx_rates.db').execute('SELECT MAX(date) FROM fx_rates').fetchone()[0])")
            git commit -m "data: daily FX refresh through ${latest}"
            git push
          fi
